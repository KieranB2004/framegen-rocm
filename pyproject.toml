[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framegen-rocm"
version = "0.1.0"
description = "Neural frame generation (RIFE) on AMD GPUs via ROCm, with CPU/ONNX fallbacks for cross-platform use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["frame interpolation", "frame generation", "AMD", "ROCm", "HIP", "video"]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.5",
    "tqdm>=4.50",
    "huggingface_hub>=0.16",
]

[project.optional-dependencies]
test = ["pytest>=7"]
onnx = ["onnx>=1.15", "onnxruntime"]
torch = ["torch"]  # install the ROCm/CUDA build separately via setup.sh

[project.scripts]
framegen = "framegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
